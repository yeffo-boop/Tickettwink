# Ticket Twink nginx reverse-proxy config.
#
# IMPORTANT: there is deliberately NO `location` block serving the ticket
# storage directory (STORAGE_LOCAL_PATH) as static files. Ticket files must
# never be publicly exposed — the only way to read one back is the
# authenticated /api/tickets/{id}/file route. Do not add a static mount
# for that directory here.

server {
    listen 80;
    server_name tickettwink.example.com;  # replace with your domain

    # Redirect to HTTPS once you've provisioned a certificate (e.g. certbot).
    # return 301 https://$host$request_uri;

    root /opt/tickettwink/frontend/dist;
    index index.html;

    client_max_body_size 12m;  # a bit above MAX_FILE_SIZE_BYTES in ticket_service.py

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # React SPA: everything else falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
